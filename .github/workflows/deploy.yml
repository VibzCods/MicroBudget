name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # -------------------------------------------------------------
      # ÉTAPE DE BUILD : Décommentez la ligne qui correspond à votre projet !
      # -------------------------------------------------------------
      
      # Option 1: Angular (ajoute le sous-dossier au chemin)
      # run: npm run build -- --base-href /MicroBudget/
      
      # Option 2: Vite (React / Vue) si non défini dans vite.config.js
      # run: npx vite build --base=/MicroBudget/
      
      # Option 3: React Create-React-App (Nécessite "homepage": "/MicroBudget/" dans package.json)
      # run: npm run build
      
      - name: Build project
        run: npm run build # Commande par défaut

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # -------------------------------------------------------------
      # DOSSIER D'UPLOAD : Modifiez le "path" selon votre framework
      # -------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite / Vue utilise "./dist"
          # React (CRA) utilise "./build"
          # Angular utilise souvent "./dist/micro-budget" ou "./dist/micro-budget/browser"
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
